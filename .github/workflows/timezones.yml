name: Update Windows timezones

on:
  schedule:
    - cron: '0 6 1 * *' # monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Generate the map from CLDR
        run: php bin/timezones.php

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/windows-timezones
          commit-message: 'chore(timezones): update Windows timezones from CLDR'
          title: 'Update Windows timezones from CLDR'
          body: 'Generated by `php bin/timezones.php` from the CLDR `windowsZones.xml`.'
