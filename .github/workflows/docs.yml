name: Documentation

on:
  push:
    branches: [ main, next ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PHPDOCUMENTOR_VERSION: v3.10.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Guides (MkDocs from docs/*.md)
        run: |
          pip install -r docs/requirements.txt
          mkdocs build

      - name: API reference (phpDocumentor from the docblocks of src/)
        run: |
          curl -sfL -o phpDocumentor.phar "https://github.com/phpDocumentor/phpDocumentor/releases/download/${PHPDOCUMENTOR_VERSION}/phpDocumentor.phar"
          php phpDocumentor.phar run --no-interaction

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    # the site shows the default branch; other branches and pull requests only check that it builds
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
