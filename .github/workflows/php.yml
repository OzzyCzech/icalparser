name: PHP Tests

on: [ push, pull_request ]

jobs:

  build:
    strategy:
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: [ '8.4', '8.5', '8.6' ]
      fail-fast: false
    runs-on: ${{ matrix.operating-system }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Unit tests
        run: composer run-script test

      - name: Integration tests
        run: composer run-script test:integration

      - name: Fuzz tests
        run: composer run-script test:fuzz

      - name: Static analysis
        run: composer run-script analyse

  coding-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Coding standard
        run: composer run-script cs

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          pip install python-dateutil

      - name: Differential tests (python-dateutil)
        run: ICALPARSER_PYTHON=python composer run-script test:differential
