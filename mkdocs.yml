site_name: PHP iCal Parser
site_description: A lightweight and robust iCalendar (RFC 5545) parser for PHP
site_url: https://ozzyczech.github.io/icalparser/
repo_url: https://github.com/OzzyCzech/icalparser
repo_name: OzzyCzech/icalparser
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/site
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

nav:
  - Introduction: index.md
  - Guide:
      - Parsing, warnings and limits: parsing.md
      - Values and timezones: values.md
      - Recurrence: recurrence.md
      - Validation: validation.md
  - Upgrading from 4.x: UPGRADING.md
  - Changelog: CHANGELOG.md
  - API reference: api/index.md
